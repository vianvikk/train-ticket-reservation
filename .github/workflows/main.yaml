
name: Maven CI CD - Tomcat Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # =========================
  # CI - BUILD AND TEST
  # =========================
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Validate with Maven
        run: mvn validate

      - name: Compile with Maven
        run: mvn compile

      - name: Test with Maven
        run: mvn test

      - name: Package with Maven
        run: mvn clean package

      - name: Verify WAR file
        run: ls -lh target/

      # Upload WAR file for deployment job
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp-war
          path: target/*.war


  # =========================
  # CD - DEPLOY TO TOMCAT
  # =========================
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: myapp-war
          path: target/

      - name: Verify downloaded WAR
        run: ls -lh target/

      # Copy WAR to Tomcat server
      - name: Copy WAR to Tomcat server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TOMCAT_HOST }}
          username: ubuntu
          key: ${{ secrets.TOMCAT_SSH_KEY }}
          source: "target/*.war"
          target: "/tmp/"

      # Deploy WAR on Tomcat
      - name: Deploy WAR to Tomcat
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TOMCAT_HOST }}
          username: ubuntu
          key: ${{ secrets.TOMCAT_SSH_KEY }}
          script: |
            echo "Stopping Tomcat..."
            sudo systemctl stop tomcat9

            echo "Removing previous application..."
            sudo rm -rf /var/lib/tomcat9/webapps/myapp
            sudo rm -f /var/lib/tomcat9/webapps/myapp.war

            echo "Copying new WAR..."
            sudo cp /tmp/*.war /var/lib/tomcat9/webapps/myapp.war

            echo "Starting Tomcat..."
            sudo systemctl start tomcat9

            echo "Checking Tomcat status..."
            sudo systemctl status tomcat9 --no-pager

            echo "Deployment completed!"
```
