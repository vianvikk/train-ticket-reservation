
name: Maven CI CD - TrainBook

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ==========================================
  # BUILD
  # ==========================================
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Validate Maven Project
        run: mvn validate

      - name: Compile Application
        run: mvn compile

      - name: Run Tests
        run: mvn test

      - name: Build WAR
        run: mvn clean package

      - name: Verify WAR
        run: |
          echo "Generated WAR:"
          ls -lh target/*.war

      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trainbook-war
          path: target/*.war


 # ==========================================
  # DEPLOY TO DEV
  # ==========================================

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest

    environment: DEV

    steps:

      - name: Download WAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: trainbook-war
          path: target/

      - name: Verify DEV WAR
        run: ls -lh target/

      - name: Copy WAR to DEV EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TOMCAT_HOST_DEV }}
          username: ubuntu
          key: ${{ secrets.TOMCAT_SSH_KEY_DEV }}
          source: target/TrainBook-1.0.0-SNAPSHOT.war
          target: /tmp/

      - name: Deploy WAR on DEV Tomcat
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TOMCAT_HOST_DEV }}
          username: ubuntu
          key: ${{ secrets.TOMCAT_SSH_KEY_DEV }}
          script: |
            sudo /root/apache_tomcat/bin/shutdown.sh || true

            sleep 5

            sudo rm -rf /root/apache_tomcat/webapps/TrainBook-1.0.0-SNAPSHOT
            sudo rm -f /root/apache_tomcat/webapps/TrainBook-1.0.0-SNAPSHOT.war

            sudo mv /tmp/TrainBook-1.0.0-SNAPSHOT.war \
              /root/apache_tomcat/webapps/

            sudo /root/apache_tomcat/bin/startup.sh

            sleep 15

            echo "DEV deployment completed"

            sudo ls -lh /root/apache_tomcat/webapps/
  # ==========================================
  # DEPLOY TO STAGING
  # ==========================================

  deploy-staging:
    needs: deploy-dev
    runs-on: ubuntu-latest

    environment: STAGING

    steps:

      - name: Download WAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: trainbook-war
          path: target/

      - name: Verify STAGING WAR
        run: ls -lh target/

      - name: Copy WAR to STAGING EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TOMCAT_HOST_STAGING }}
          username: ubuntu
          key: ${{ secrets.TOMCAT_SSH_KEY_STAGING }}
          source: target/TrainBook-1.0.0-SNAPSHOT.war
          target: /tmp/

      - name: Deploy WAR on STAGING Tomcat
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TOMCAT_HOST_STAGING }}
          username: ubuntu
          key: ${{ secrets.TOMCAT_SSH_KEY_STAGING }}
          script: |
            sudo /root/apache_tomcat/bin/shutdown.sh || true

            sleep 5

            sudo rm -rf /root/apache_tomcat/webapps/TrainBook-1.0.0-SNAPSHOT
            sudo rm -f /root/apache_tomcat/webapps/TrainBook-1.0.0-SNAPSHOT.war

            sudo mv /tmp/TrainBook-1.0.0-SNAPSHOT.war \
              /root/apache_tomcat/webapps/

            sudo /root/apache_tomcat/bin/startup.sh

            sleep 15

            echo "STAGING deployment completed"

            sudo ls -lh /root/apache_tomcat/webapps/