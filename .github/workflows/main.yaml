
name: Maven CI CD - TrainBook

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ==========================================
  # BUILD
  # ==========================================
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Validate Maven Project
        run: mvn validate

      - name: Compile Application
        run: mvn compile

      - name: Run Tests
        run: mvn test

      - name: Build WAR
        run: mvn clean package

      - name: Verify WAR
        run: |
          echo "Generated WAR:"
          ls -lh target/*.war

      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trainbook-war
          path: target/*.war


# ==========================================
# DEPLOY TO DEV
# ==========================================

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: DEV

    steps:
      - name: Download WAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: trainbook-war
          path: target/

      - name: Verify DEV WAR
        run: ls -lh target/

      - name: Copy WAR to DEV EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TOMCAT_HOST_DEV }}
          username: ubuntu
          key: ${{ secrets.TOMCAT_SSH_KEY_DEV }}
          source: target/TrainBook-1.0.0-SNAPSHOT.war
          target: /tmp/
          strip_components: 1

      - name: Find WAR on DEV EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TOMCAT_HOST_DEV }}
          username: ubuntu
          key: ${{ secrets.TOMCAT_SSH_KEY_DEV }}
          script: |
            echo "===== DEV SERVER ====="
            hostname

            echo "===== PUBLIC IP ====="
            curl -s http://checkip.amazonaws.com

            echo "===== SEARCH FOR TRAINBOOK WAR ====="
            sudo find /tmp -maxdepth 3 -type f -iname "*TrainBook*" -ls

            echo "===== FULL /tmp LIST ====="
            sudo ls -lah /tmp/

            echo "===== EXPECTED WAR ====="
            sudo ls -lh /tmp/TrainBook-1.0.0-SNAPSHOT.war

      - name: Deploy WAR on DEV Tomcat
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TOMCAT_HOST_DEV }}
          username: ubuntu
          key: ${{ secrets.TOMCAT_SSH_KEY_DEV }}
          script: |
            set -e

            echo "===== STOP TOMCAT ====="
            sudo /root/apache_tomcat/bin/shutdown.sh || true
            sleep 5

            echo "===== REMOVE OLD APPLICATION ====="
            sudo rm -rf /root/apache_tomcat/webapps/TrainBook-1.0.0-SNAPSHOT
            sudo rm -f /root/apache_tomcat/webapps/TrainBook-1.0.0-SNAPSHOT.war

            echo "===== MOVE NEW WAR ====="
            sudo mv /tmp/TrainBook-1.0.0-SNAPSHOT.war \
              /root/apache_tomcat/webapps/

            echo "===== START TOMCAT ====="
            sudo /root/apache_tomcat/bin/startup.sh

            sleep 15

            echo "===== VERIFY DEPLOYMENT ====="
            sudo ls -lh /root/apache_tomcat/webapps/

            echo "===== VERIFY APPLICATION ====="
            curl -I http://localhost:8080/TrainBook-1.0.0-SNAPSHOT/
  # ==========================================
  # DEPLOY TO STAGING
