
name: Maven CI CD - TrainBook

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ==========================================
  # BUILD
  # ==========================================
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Validate Maven Project
        run: mvn validate

      - name: Compile Application
        run: mvn compile

      - name: Run Tests
        run: mvn test

      - name: Build WAR
        run: mvn clean package

      - name: Verify WAR
        run: |
          echo "Generated WAR:"
          ls -lh target/*.war

      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trainbook-war
          path: target/*.war


  # ==========================================
  # DEPLOY
  # ==========================================
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Download WAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: trainbook-war
          path: target/

      - name: Verify Downloaded WAR
        run: |
          echo "WAR downloaded:"
          ls -lh target/*.war

      # --------------------------------------
      # COPY WAR TO EC2
      # --------------------------------------
      - name: Copy WAR to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TOMCAT_HOST }}
          username: ubuntu
          key: ${{ secrets.TOMCAT_SSH_KEY }}
          source: "target/TrainBook-1.0.0-SNAPSHOT.war"
          target: "/tmp/"

      # --------------------------------------
      # DEPLOY TO TOMCAT
      # --------------------------------------
      - name: Deploy to Tomcat 9
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TOMCAT_HOST }}
          username: ubuntu
          key: ${{ secrets.TOMCAT_SSH_KEY }}

          script: |

            echo "======================================"
            echo "Starting deployment"
            echo "======================================"

            echo "Stopping Tomcat 9..."

            sudo /root/apache_tomcat/bin/shutdown.sh || true

            echo "Waiting for Tomcat to stop..."
            sleep 5

            echo "Checking port 8080..."

            if sudo ss -ltnp | grep -q ':8080'; then
              echo "Tomcat is still running. Waiting..."
              sleep 5
            fi

            echo "======================================"
            echo "Removing previous TrainBook application"
            echo "======================================"

            sudo rm -rf /root/apache_tomcat/webapps/TrainBook-1.0.0-SNAPSHOT
            sudo rm -f /root/apache_tomcat/webapps/TrainBook-1.0.0-SNAPSHOT.war

            echo "======================================"
            echo "Copying new WAR"
            echo "======================================"

            sudo cp /tmp/TrainBook-1.0.0-SNAPSHOT.war \
              /root/apache_tomcat/webapps/TrainBook-1.0.0-SNAPSHOT.war

            echo "======================================"
            echo "Starting Tomcat 9"
            echo "======================================"

            sudo /root/apache_tomcat/bin/startup.sh

            echo "Waiting for Tomcat to start..."
            sleep 10

            echo "======================================"
            echo "Checking Tomcat port"
            echo "======================================"

            sudo ss -ltnp | grep ':8080'

            echo "======================================"
            echo "Checking deployed WAR"
            echo "======================================"

            sudo ls -lh /root/apache_tomcat/webapps/

            echo "======================================"
            echo "Deployment completed successfully!"
            echo "======================================"
